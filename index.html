<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Cormorant+Garamond:wght@500;600&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#121110;--sf:#1c1a17;--s2:#25221e;--ln:#34302a;--tx:#f3eee6;--mu:#a39a8c;--am:#e5a91f;--am2:#f3c04a}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.6 Barlow,"Segoe UI",Arial,sans-serif}
h1,h2,h3{font-family:"Barlow Condensed","Arial Narrow",Impact,sans-serif;letter-spacing:.01em;margin:0}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;padding:10px max(18px,calc(50% - 560px));background:rgba(18,17,16,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--ln)}
header img{height:46px;display:block}.bar{display:flex;gap:8px}
button{font:inherit;font-weight:600;background:var(--am);color:#1b1407;border:0;border-radius:8px;padding:11px 20px;cursor:pointer;transition:background .15s}
button:hover{background:var(--am2)}button.g{background:transparent;color:var(--tx);border:1px solid var(--ln)}button.g:hover{border-color:var(--am);background:transparent}
a.btn{display:inline-block;text-decoration:none;font-weight:600;background:var(--am);color:#1b1407;border-radius:8px;padding:11px 20px}a.btn.g{background:transparent;color:var(--tx);border:1px solid var(--ln)}
:focus-visible{outline:2px solid var(--am);outline-offset:2px}
main{max-width:1120px;margin:0 auto;padding:0 18px 60px}
.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:30px;align-items:center;padding:56px 0 34px}
.hero h1{font-size:clamp(40px,7vw,72px);line-height:1;text-transform:none}.hero p{color:var(--mu);font-size:18px;max-width:46ch;margin:16px 0 24px}
.hero .art{position:relative;display:grid;place-items:center}.hero .art:before{content:"";position:absolute;width:78%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,#e5a91f33,transparent 68%)}.hero .art img{position:relative;width:min(100%,380px)}
.cta{display:flex;gap:10px;flex-wrap:wrap}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:18px}.card h3{font-size:20px;color:var(--am);margin-bottom:6px}.card p,.card td{margin:0;color:var(--mu);font-size:15px}.card a{color:var(--tx);text-decoration:none;font-weight:600}
.card table{width:100%;border-collapse:collapse}.card td{padding:2px 0;border:0}.card td:last-child{text-align:right;color:var(--tx)}
@media(max-width:900px){.cards{grid-template-columns:1fr 1fr}.hero{grid-template-columns:1fr;padding-top:34px}.hero .art{order:-1;max-height:220px}.hero .art img{width:200px}}@media(max-width:520px){.cards{grid-template-columns:1fr}}
section{margin-top:44px}h2{font-size:34px;margin-bottom:14px}.mu{color:var(--mu)}.note{font-size:14px;color:var(--mu)}
.box{background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:22px}
.mapw{position:relative;border-radius:14px;overflow:hidden;border:1px solid var(--ln)}iframe{width:100%;height:340px;border:0;display:block;filter:grayscale(.3) contrast(1.05)}.mapw .btn{position:absolute;right:12px;bottom:12px}
label{display:block;margin:12px 0 5px;font-size:14px;font-weight:500;color:var(--mu)}
input,select,textarea{font:inherit;color:var(--tx);width:100%;background:#0f0e0c;border:1px solid var(--ln);border-radius:8px;padding:11px 12px}input:focus,select:focus,textarea:focus{border-color:var(--am);outline:0}
.bk{display:grid;grid-template-columns:1fr 1fr;gap:26px}@media(max-width:800px){.bk{grid-template-columns:1fr}}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:10px}.cal b{text-align:center;font-size:12px;color:var(--mu);font-weight:500}
.cal button{background:var(--s2);color:var(--tx);padding:11px 0;font-weight:500;border-radius:8px}.cal button:disabled{opacity:.22;cursor:default}.cal button.on,.cal button:hover:not(:disabled){background:var(--am);color:#1b1407}
.slots{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}.slots button{background:var(--s2);color:var(--tx);border:1px solid var(--ln);padding:10px 16px}.slots button.on,.slots button:hover{background:var(--am);color:#1b1407}
.msg{padding:13px 15px;border-radius:8px;margin-top:14px}.msg.e{background:#3a1f1b;color:#ffb4aa}.msg.o{background:#1d2e1e;color:#b9e6bc}
table.t{width:100%;border-collapse:collapse}.t td,.t th{padding:9px 8px;border-bottom:1px solid var(--ln);text-align:left;font-size:14px}.t input,.t select{padding:7px}
.tabs{display:flex;gap:8px;margin:14px 0;flex-wrap:wrap}.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;align-items:end}
footer{border-top:1px solid var(--ln);padding:22px;text-align:center;color:var(--mu);font-size:14px}
.hide{display:none}body.mv #book>h2,body.mv #svc,body.mv #tw,body.mv #form,body.mv #book .col>label:first-child{display:none}

h1,h2,h3{font-family:"Cormorant Garamond",Georgia,serif;font-weight:600;letter-spacing:0}.hero h1{font-size:clamp(46px,8.5vw,100px);font-weight:500;line-height:.96}
header{padding-top:8px;padding-bottom:8px}#burger{background:none;border:0;padding:12px 4px;display:grid;gap:9px;cursor:pointer}#burger i{display:block;width:32px;height:1px;background:var(--tx)}#burger:hover i{background:var(--am)}
#menu{position:fixed;inset:0;z-index:20;background:#0d0c0bf7;display:flex;flex-direction:column;justify-content:center;padding:0 max(24px,calc(50% - 560px));opacity:0;visibility:hidden;transition:opacity .35s,visibility .35s}#menu.open{opacity:1;visibility:visible}
#menu a.m{font:500 clamp(36px,6.5vw,68px)/1.22 "Cormorant Garamond",Georgia,serif;color:var(--tx);text-decoration:none;width:max-content}#menu a.m:hover{color:var(--am)}#menu .x{position:absolute;top:16px;right:max(18px,calc(50% - 560px))}
.page{padding-top:44px;min-height:62vh}.page.hide{display:none}.page>h1{font-size:clamp(40px,6vw,72px);margin-bottom:26px;font-weight:500}.legal{max-width:72ch}.legal h3{font-size:28px;margin:28px 0 6px;color:var(--am)}.legal p{color:var(--mu)}
.grid3{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:34px 26px}.mem img{width:100%;aspect-ratio:4/5;object-fit:cover;display:block;background:var(--s2)}.mem h3{font-size:30px;margin:14px 0 0}.mem span{color:var(--am);font-size:15px}.mem p{color:var(--mu);font-size:15px}
.post{display:block;color:inherit;text-decoration:none}.post img{width:100%;aspect-ratio:16/10;object-fit:cover;display:block;background:var(--s2)}.post time,#post time{color:var(--mu);font-size:14px;display:block;margin-top:12px}.post h3{font-size:29px;line-height:1.1;margin:4px 0 6px}.post:hover h3{color:var(--am)}.post p{color:var(--mu);margin:0 0 6px}.post small,#post small{color:var(--mu)}
.ban{width:100%;max-height:520px;object-fit:cover;display:block;margin:18px 0}.pbody{max-width:68ch}.pbody p{font-size:19px;line-height:1.85}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:14px 0}.kp div{background:var(--s2);padding:16px;border-radius:10px;color:var(--mu)}.kp b{display:block;font:600 40px "Cormorant Garamond",serif;color:var(--am)}.br{height:8px;background:var(--am);border-radius:4px;margin:4px 0 12px}

async function loadTeam(){const{data}=await sb.from("team").select("*").order("sort").order("id");$("teamList").innerHTML=data?.length?data.map(m=>`<article class="mem"><img src="${esc(m.photo)}" alt="${esc(m.name)}" loading="lazy"><h3>${esc(m.name)}</h3><span>${esc(m.title)}</span><p>${esc(m.bio)}</p></article>`).join(""):`<p class="mu">${tt("soon")}</p>`}
async function loadBlog(){const{data}=await sb.from("posts").select("id,title,excerpt,banner,published_at,views").lte("published_at",fmt(new Date())).order("published_at",{ascending:false});$("blogList").innerHTML=data?.length?data.map(p=>`<a class="post" href="#/blog/${p.id}"><img src="${esc(p.banner)}" alt="" loading="lazy"><time>${dt(p.published_at)}</time><h3>${esc(p.title)}</h3><p>${esc(p.excerpt)}</p><small>${p.views} ${tt("views")}</small></a>`).join(""):`<p class="mu">${tt("soon")}</p>`}
async function loadPost(id){const{data:p}=await sb.from("posts").select("*").eq("id",+id).maybeSingle();if(!p){$("post").innerHTML=`<p>${tt("bad")}</p>`;return}
 const k="v"+id;if(!localStorage[k]){localStorage[k]=1;sb.rpc("inc_view",{p_id:p.id});p.views++}
 $("post").innerHTML=`<a href="#/blog" class="mu">← ${tt("all")}</a><img class="ban" src="${esc(p.banner)}" alt=""><time>${dt(p.published_at)}</time><h1>${esc(p.title)}</h1><small>${p.views} ${tt("views")}</small><div class="pbody">${para(p.body)}</div>`}
async function loadHist(){const{data}=await sb.from("site_text").select("*").eq("key","history").maybeSingle();$("histBody").innerHTML=data?.[L]?para(data[L]):`<p>${tt("soon")}</p>`}
async function up(f){if(!f)return"";const n=Date.now()+"-"+f.name.replace(/[^\w.]/g,"_");const{error}=await sb.storage.from("media").upload(n,f);if(error){alert(error.message);return null}return sb.storage.from("media").getPublicUrl(n).data.publicUrl}
async function content(){const{data:t}=await sb.from("team").select("*").order("sort").order("id");$("tlist").innerHTML=(t||[]).map(m=>`<tr><td>${esc(m.name)}<br><span class="note">${esc(m.title)}</span></td><td><button class="g" data-t="${m.id}">✕</button></td></tr>`).join("");
 const{data:q}=await sb.from("posts").select("id,title,views,published_at").order("published_at",{ascending:false});$("plist").innerHTML=(q||[]).map(m=>`<tr><td>${esc(m.title)}<br><span class="note">${m.published_at} · ${m.views} ${tt("views")}</span></td><td><button class="g" data-p="${m.id}">✕</button></td></tr>`).join("");
 const{data:h}=await sb.from("site_text").select("*").eq("key","history").maybeSingle();$("hb").value=h?.bg||"";$("he").value=h?.en||"";
 document.querySelectorAll("[data-t]").forEach(b=>b.onclick=async()=>{if(confirm("?")){await sb.from("team").delete().eq("id",b.dataset.t);content()}});document.querySelectorAll("[data-p]").forEach(b=>b.onclick=async()=>{if(confirm("?")){await sb.from("posts").delete().eq("id",b.dataset.p);content()}})}
$("yadd").onclick=async()=>{if(!$("yn").value)return;const u=await up($("yf").files[0]);if(u===null)return;const{error:e1}=await sb.from("team").insert({name:$("yn").value,title:$("yr").value,bio:$("yb").value,photo:u});if(e1)return alert(e1.message);["yn","yr","yb","yf"].forEach(i=>$(i).value="");content()};
$("xadd").onclick=async()=>{if(!$("xt").value||!$("xb").value)return;const u=await up($("xf").files[0]);if(u===null)return;const{error:e2}=await sb.from("posts").insert({title:$("xt").value,excerpt:$("xe").value,body:$("xb").value,banner:u,published_at:$("xd").value||fmt(new Date())});if(e2)return alert(e2.message);["xt","xe","xb","xf","xd"].forEach(i=>$(i).value="");content()};
$("hsv").onclick=async()=>{const{error}=await sb.from("site_text").upsert({key:"history",bg:$("hb").value,en:$("he").value});alert(error?error.message:"OK")};
$("zgo").onclick=async()=>{const{data:d,error}=await sb.rpc("stats",{p_from:$("zf").value||"2000-01-01",p_to:$("zt").value||"2100-01-01"});if(error||d.error)return alert(error?.message||d.error);const mx=Math.max(1,...d.services.map(x=>x.c),...d.posts.map(x=>x.v)),r=d.done+d.noshow?Math.round(100*d.done/(d.done+d.noshow)):0;
 $("zbox").innerHTML=`<div class="kp"><div><b>${d.total}</b>${tt("tot")}</div><div><b>${d.done}</b>${tt("came")}</div><div><b>${d.noshow}</b>${tt("lost")}</div><div><b>${d.moved}</b>${tt("mv")}</div><div><b>${d.cancelled}</b>${tt("cx")}</div><div><b>${r}%</b>${tt("rate")}</div><div><b>${d.upcoming}</b>${tt("up")}</div></div><h3>${tt("bys")}</h3>${d.services.map(x=>`${esc(x.n)}: ${x.c}<div class="br" style="width:${100*x.c/mx}%"></div>`).join("")}<h3>${tt("byp")}</h3>${d.posts.map(x=>`${esc(x.t)}: ${x.v}<div class="br" style="width:${100*x.v/mx}%"></div>`).join("")}`};
// ----- start -----
(async()=>{const{data}=await sb.from("services").select("*").eq("active",true).order("sort");svcs=data||[];i18n();
 const t=new URLSearchParams(location.search).get("t");if(t)manage(t);else slots();route()})();
</script></body></html>
